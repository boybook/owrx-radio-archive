name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: radio-archive
          path: dist/radio-archive.js
          retention-days: 30

      - name: Update nightly release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 检查 nightly release 是否存在，不存在则创建
          if ! gh release view nightly &>/dev/null; then
            gh release create nightly \
              --title "Nightly Build" \
              --notes "自动构建的最新版本，每次推送到 main 分支时更新。" \
              --prerelease
          fi

          # 删除旧的附件（如果存在）
          gh release delete-asset nightly radio-archive.js --yes || true

          # 上传新的构建产物
          gh release upload nightly dist/radio-archive.js --clobber

          # 更新 release 说明，添加最后更新时间
          gh release edit nightly \
            --notes "自动构建的最新版本，每次推送到 main 分支时更新。

          **最后更新**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          **Commit**: ${{ github.sha }}"

      - name: Install OSSUtil
        run: |
          curl -o /tmp/ossutil64 https://gosspublic.alicdn.com/ossutil/1.7.8/ossutil64
          chmod +x /tmp/ossutil64
          sudo mv /tmp/ossutil64 /usr/local/bin/ossutil

      - name: Upload to Aliyun OSS
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
          OSS_BUCKET: bg5drb
          OSS_REGION: oss-cn-hangzhou
        run: |
          ossutil config -e ${OSS_REGION}.aliyuncs.com -i ${OSS_ACCESS_KEY_ID} -k ${OSS_ACCESS_KEY_SECRET}
          ossutil cp -r ./dist/radio-archive.js oss://${OSS_BUCKET}/ --force